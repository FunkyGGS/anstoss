<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anstoß – Fußball-Manager</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --surface2:#F6F8FB; --ink:#132036; --muted:#5A667A; --line:#D7DDE7;
  --accent:#1D4ED8; --accent-soft:#E3EBFD; --accent-ink:#FFFFFF; --gold:#A87708;
  --crit:#C2292E; --crit-bg:#FBE3E3; --warn:#A8620B; --warn-bg:#FCEFD9; --ok:#23784A; --ok-bg:#DFF2E6;
  --head:#0F1B33; --head-ink:#E8EDF7; --head-muted:#97A4BE;
  --f-disp:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --r:8px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0C1220; --surface:#141C2C; --surface2:#1A2335; --ink:#E5EAF3; --muted:#94A1B6; --line:#27324A;
  --accent:#7C9DFF; --accent-soft:#1E2B4D; --accent-ink:#0C1220; --gold:#E0B14A;
  --crit:#FF7A7A; --crit-bg:#3A1C22; --warn:#F2B45A; --warn-bg:#382A16; --ok:#5FCB8B; --ok-bg:#16301F;
  --head:#080D18; --head-ink:#E8EDF7; --head-muted:#8B98B0; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);font-variant-numeric:tabular-nums;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:1100px;margin:0 auto;padding:0 max(14px,env(safe-area-inset-left)) 0 max(14px,env(safe-area-inset-right))}
header{position:sticky;top:0;z-index:5;background:var(--head);color:var(--head-ink);padding-top:env(safe-area-inset-top)}
.topin{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 0 6px}
.crest{width:38px;height:38px;border-radius:50% 50% 46% 46%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 16px var(--f-disp);letter-spacing:.04em;flex:none}
.club b{font:700 21px/1 var(--f-disp);letter-spacing:.02em;display:block}
.club small{color:var(--head-muted);font-size:12px}
.kpis{display:flex;gap:16px;flex-wrap:wrap;margin-left:auto}
.kpi{display:flex;flex-direction:column;min-width:60px}
.kpi label{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--head-muted)}
.kpi b{font:600 21px/1.05 var(--f-disp)}
.kpi.alert b{color:#FF8A8A}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav button{font:600 16px var(--f-disp);letter-spacing:.03em;color:var(--head-muted);background:none;border:0;padding:8px 12px 10px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button[aria-selected=true]{color:var(--head-ink);border-bottom-color:var(--accent)}
main{padding:16px 0 60px}
h2{font:700 25px var(--f-disp);margin:0 0 2px}
h3{font:600 18px var(--f-disp);letter-spacing:.02em;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:5px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td.r,th.r{text-align:right}
tr.me td{background:var(--accent-soft);font-weight:600}
tr.hum td:nth-child(2){color:var(--accent);font-weight:600}
tr.up td:first-child{box-shadow:inset 3px 0 0 var(--ok)} tr.down td:first-child{box-shadow:inset 3px 0 0 var(--crit)}
tr.xi td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{font:500 14px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:7px 13px;cursor:pointer}
.btn:hover{border-color:var(--accent)} .btn:disabled{opacity:.5;cursor:not-allowed}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)} .small{font-size:12px} .ok{color:var(--ok)} .crit{color:var(--crit)} .warn{color:var(--warn)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.crit{background:var(--crit-bg);color:var(--crit)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.bar{height:7px;border-radius:4px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
.kv label{color:var(--muted)}
.big{font:700 34px/1 var(--f-disp)}
.match{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.match .t{font:600 19px var(--f-disp)}
.score{font:700 30px var(--f-disp);padding:4px 12px;background:var(--surface2);border-radius:6px}
.news{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.news div{font-size:13px;border-bottom:1px dashed var(--line);padding-bottom:5px}
.note{background:var(--surface2);border:1px dashed var(--line);border-radius:6px;padding:9px 11px;font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--head);color:var(--head-ink);padding:10px 16px;border-radius:8px;z-index:20;font-size:14px;max-width:92vw}
.center{min-height:70vh;display:grid;place-items:center}
.auth{max-width:380px;width:100%}
.auth input{width:100%;margin-bottom:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:13px;border:0;background:var(--surface);color:var(--muted);padding:6px 11px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.choice{display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;font:inherit;color:inherit}.choice b{font:700 22px var(--f-disp)}.choice span{color:var(--muted)}.choice:hover,.choice.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.lvl{font:600 12px var(--f-disp);color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
</style>
</head>
<body>
<div id="app"><div class="center"><div class="muted">Lade Spielwelt …</div></div></div>
<script type="module" src="./app.js?v=202611221301"></script>
</body>
</html>
